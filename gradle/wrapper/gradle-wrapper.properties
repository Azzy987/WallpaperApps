# DO NOT upgrade to Gradle 9.6.0 or newer while this project is on AGP 8.13.2.
#
# Android Studio suggests 9.7.0. Tested: the build fails at configuration with
#   Plugin 'com.android.internal.library' relies on
#   'org.gradle.api.problems.internal.InternalProblems', a Gradle internal API
#   that was removed in Gradle 9.6.0
# AGP 8.x uses that internal API, so 9.5 is the highest Gradle this AGP supports.
# Upgrading Gradle requires moving to AGP 9.x first, which is its own migration.
#
# AGP 9 retested 2026-09-20. It is blocked, and the blocker is circular:
#
#   1. AGP 9 removed com.android.build.gradle.BaseExtension.
#   2. AGP 9 provides Kotlin compilation itself, so it tells you to REMOVE the
#      org.jetbrains.kotlin.android plugin.
#   3. But KSP refuses to run against built-in Kotlin: "KSP is not compatible with
#      Android Gradle Plugin's built-in Kotlin ... add android.builtInKotlin=false
#      and apply kotlin("android")". Every module needs KSP for Hilt and Room.
#   4. Applying kotlin("android") then fails, because the Kotlin Android plugin still
#      casts the AGP extension to BaseExtension — tested up to Kotlin 2.3.21, the
#      newest release.
#
# So KSP requires the Kotlin plugin, and the Kotlin plugin requires the class AGP 9
# deleted. Nothing in this project can break that cycle; it needs either KSP support
# for built-in Kotlin or a Kotlin plugin that no longer uses BaseExtension.
#
# Hilt is NOT the blocker, contrary to an earlier note here. That failure came from
# the plugin still resolving 2.55: its version is pinned in the ROOT build.gradle.kts
# (id("com.google.dagger.hilt.android") version "…"), not in libs.versions.toml, so
# bumping hiltAndroid there changes only the libraries. Hilt 2.60.1 applies fine on
# AGP 9 and contains no BaseExtension reference.
#
# Also established, for whenever this is retried:
#   * KSP still versions as <kotlin>-<ksp> (e.g. 2.2.21-2.0.5). The bare 2.3.x builds
#     are a separate line and do not pair with Kotlin 2.3.x.
#   * KSP has no 2.4.x build, so Kotlin 2.4 is out regardless.
#   * android.r8.integratedResourceShrinking becomes deprecated under AGP 9.
#
